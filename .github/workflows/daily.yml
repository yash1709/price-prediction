name: daily-forecasts

# Weekdays 11:30 UTC = 17:00 IST, after the NSE close (15:30 IST) and Yahoo's end-of-day update.
# GitHub may delay scheduled runs; trigger manually from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecasts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Results live on the `live-data` branch so daily commits never redeploy the Streamlit app.
      - name: Check out the live-data branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data
            git worktree add -B live-data live_out origin/live-data
          else
            git worktree add --orphan -b live-data live_out
          fi

      - name: Run the daily job
        id: job
        run: python scripts/daily_job.py --out live_out/live --max-minutes 40

      - name: Commit results
        if: always()
        run: |
          cd live_out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily forecasts $(date -u +%F)"
            git push origin live-data
          fi
