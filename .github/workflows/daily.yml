name: daily-forecasts

# Weekdays 11:30 UTC = 17:00 IST, after the NSE close (15:30 IST) and Yahoo's end-of-day update.
# GitHub may delay scheduled runs; trigger manually from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecasts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Results live on the `live-data` branch so daily commits never redeploy the Streamlit app.
      - name: Check out the live-data branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data
            git worktree add -B live-data live_out origin/live-data
          else
            git worktree add --orphan -b live-data live_out
          fi

      - name: Run the daily job
        id: job
        run: python scripts/daily_job.py --out live_out/live --max-minutes 40

      - name: Commit results
        if: always()
        run: |
          cd live_out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily forecasts $(date -u +%F)"
            git push origin live-data
          fi

      # A red run is what makes GitHub email you. scripts/daily_job.py already exits 2 on "failed";
      # this step also fails the run on "degraded" (some stocks missing), after results are committed.
      - name: Alert unless the run was fully ok
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          try:
              s = json.load(open("live_out/live/summary.json"))
          except Exception as exc:
              print(f"::error::Daily job produced no readable summary.json ({exc})")
              sys.exit(1)
          lines = [f"### Daily forecasts: {s['status']}",
                   f"{s['symbols_ok']}/{s['symbols_requested']} stocks fetched, "
                   f"{s['new_forecasts']} new forecasts, {s['new_outcomes']} new outcomes "
                   f"(as of {s['as_of_date']})."]
          for f in s.get("failed", [])[:20]:
              lines.append(f"- `{f['symbol']}`: {f['reason']}")
          if s["n_failed"] > 20:
              lines.append(f"- ... and {s['n_failed'] - 20} more (see summary.json on the live-data branch)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
          if s["status"] != "ok":
              print(f"::error::Daily job status is {s['status']} "
                    f"({s['symbols_ok']}/{s['symbols_requested']} stocks fetched)")
              sys.exit(1)
          PY
